<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestione Olio v2</title>

<style>
/* --- TUTTO IL TUO CSS ORIGINALE --- */
:root{
 --g:#1f5133;
 --o:#708238;
 --bg:#f6f4eb;
 --tx:#18221b;
 --mu:#657068;
 --ln:#dbe2da;
 --red:#a93636
}

*{box-sizing:border-box}

body{
 margin:0;
 font:15px system-ui;
 color:var(--tx);
 background:var(--bg)
}

header{
 background:var(--g);
 color:#fff;
 padding:18px 24px;
 display:flex;
 justify-content:space-between;
 align-items:center
}

h1{margin:0;font-size:22px}
small{opacity:.8}

.app{
 display:grid;
 grid-template-columns:210px 1fr;
 min-height:calc(100vh - 66px)
}

nav{
 background:#fff;
 padding:16px 10px;
 border-right:1px solid var(--ln)
}

nav button{
 display:block;
 width:100%;
 border:0;
 background:none;
 text-align:left;
 padding:11px;
 border-radius:8px;
 font-weight:650;
 cursor:pointer
}

nav button.active,
nav button:hover{
 background:#e8f0e9;
 color:var(--g)
}

main{
 padding:24px;
 min-width:0
}

.view{display:none}
.view.active{display:block}

.title{
 display:flex;
 justify-content:space-between;
 align-items:end;
 gap:12px;
 margin-bottom:17px
}

.title h2{margin:0}
.title p{margin:4px 0;color:var(--mu)}

.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap
}

.btn{
 border:1px solid var(--ln);
 background:#fff;
 padding:9px 12px;
 border-radius:8px;
 font-weight:650;
 cursor:pointer
}

.primary{
 background:var(--g);
 color:#fff;
 border-color:var(--g)
}

.danger{color:var(--red)}

.cards{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:12px;
 margin-bottom:18px
}

.card,.panel{
 background:#fff;
 border:1px solid var(--ln);
 border-radius:11px
}

.card{padding:15px}

.card span{
 display:block;
 color:var(--mu);
 font-size:11px;
 text-transform:uppercase;
 font-weight:750
}

.card b{
 display:block;
 color:var(--g);
 font-size:23px;
 margin-top:5px
}

.story{
 background:#eef2e4;
 border-left:4px solid var(--o);
 padding:12px 15px;
 border-radius:0 8px 8px 0;
 margin-bottom:17px
}

.panel{
 overflow:hidden;
 margin-bottom:17px
}

.panel h3{
 margin:0;
 padding:13px 15px;
 border-bottom:1px solid var(--ln)
}

.pad{padding:16px}
.table{overflow:auto}

table{
 width:100%;
 border-collapse:collapse;
 min-width:760px
}

th,td{
 padding:9px 11px;
 border-bottom:1px solid var(--ln);
 text-align:left;
 white-space:nowrap
}

th{
 font-size:11px;
 text-transform:uppercase;
 color:var(--mu);
 background:#fafbf9
}

.num{text-align:right}

.empty{
 text-align:center;
 color:var(--mu);
 padding:28px
}

.icon{
 border:0;
 background:none;
 font-size:17px;
 cursor:pointer
}

.edit{color:var(--g)}
.delete{color:var(--red)}

.pill{
 border:0;
 border-radius:999px;
 padding:4px 9px;
 font-weight:700;
 cursor:pointer
}

.yes{
 background:#dceee1;
 color:#24633a
}

.no{
 background:#f7e2df;
 color:#8e332c
}

dialog{
 border:0;
 border-radius:13px;
 padding:0;
 width:min(680px,calc(100% - 24px));
 box-shadow:0 18px 55px #0005
}

dialog::backdrop{background:#14201999}

.mh{
 background:var(--g);
 color:#fff;
 padding:15px 18px;
 display:flex;
 justify-content:space-between
}

.mh h3{margin:0}
.mb{padding:18px}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:13px
}

.field.full{grid-column:1/-1}

.field label{
 display:block;
 font-size:12px;
 color:var(--mu);
 font-weight:700;
 margin-bottom:4px
}

.field input,
.field textarea,
.field select{
 width:100%;
 padding:9px;
 border:1px solid #cad3ca;
 border-radius:7px;
 font:inherit
}

.ma{
 display:flex;
 justify-content:flex-end;
 gap:8px;
 margin-top:17px
}

.setup{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px
}

.note{
 color:var(--mu);
 font-size:13px
}

@media(max-width:900px){
 .app{grid-template-columns:1fr}

 nav{
  display:flex;
  overflow:auto;
  border:0;
  border-bottom:1px solid var(--ln)
 }

 nav button{
  width:auto;
  white-space:nowrap
 }

 .cards{grid-template-columns:1fr 1fr}
 .setup{grid-template-columns:1fr}
}

@media(max-width:560px){
 .cards,.grid{grid-template-columns:1fr}

 .title{
  align-items:start;
  flex-direction:column
 }
}

@media print{
 header,nav,.actions,.icon,dialog,#settings{
  display:none!important
 }

 body,.app,main{
  display:block;
  background:#fff;
  padding:0
 }

 .view{display:none!important}
 .view.active{display:block!important}

 .panel,.card{
  box-shadow:none;
  break-inside:avoid
 }

 .table{overflow:visible}

 table{
  min-width:0;
  font-size:10px
 }

 th,td{
  padding:5px;
  white-space:normal
 }

 .cards{grid-template-columns:repeat(5,1fr)}
 .card b{font-size:16px}

 @page{
  size:landscape;
  margin:12mm
 }
}
</style>
</head>

<script>
